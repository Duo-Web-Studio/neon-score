  <body style="background:#0A0A0A;margin:0;">
    <div id="root">
      <div id="boot-splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0A0A0A;z-index:9999;">
        <div style="position:relative;width:300px;height:40px;">
          <div class="boot-arrow boot-arrow-1" style="position:absolute;left:0;top:0;width:100px;height:40px;">
            <svg viewBox="0 0 120 40" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs><linearGradient id="bootGrad1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFD600"/><stop offset="100%" stop-color="#FF8F00"/></linearGradient></defs>
              <path d="M8 20 L92 20" stroke="url(#bootGrad1)" stroke-width="6" stroke-linecap="round"/>
              <path d="M82 6 L104 20 L82 34" stroke="url(#bootGrad1)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>
          <div class="boot-arrow boot-arrow-2" style="position:absolute;left:100px;top:0;width:100px;height:40px;">
            <svg viewBox="0 0 120 40" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs><linearGradient id="bootGrad2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFD600"/><stop offset="100%" stop-color="#FF8F00"/></linearGradient></defs>
              <path d="M8 20 L92 20" stroke="url(#bootGrad2)" stroke-width="6" stroke-linecap="round"/>
              <path d="M82 6 L104 20 L82 34" stroke="url(#bootGrad2)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>
          <div class="boot-arrow boot-arrow-3" style="position:absolute;left:200px;top:0;width:100px;height:40px;">
            <svg viewBox="0 0 120 40" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs><linearGradient id="bootGrad3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFD600"/><stop offset="100%" stop-color="#FF8F00"/></linearGradient></defs>
              <path d="M8 20 L92 20" stroke="url(#bootGrad3)" stroke-width="6" stroke-linecap="round"/>
              <path d="M82 6 L104 20 L82 34" stroke="url(#bootGrad3)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>
        </div>
      </div>
      <style>
        .boot-arrow{opacity:0;transform:translateX(-40px) scale(.85);animation:bootArrowIn 380ms cubic-bezier(.22,1,.36,1) both}
        .boot-arrow-1{animation-delay:0ms}
        .boot-arrow-2{animation-delay:280ms}
        .boot-arrow-3{animation-delay:560ms}
        @keyframes bootArrowIn{0%{opacity:0;transform:translateX(-40px) scale(.85)}60%{opacity:1}100%{opacity:1;transform:translateX(0) scale(1)}}
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
